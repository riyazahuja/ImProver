# ------------- train_32k_deepseek-r1-qwen7b-lora.yaml -------------
base_model: /data/user_data/riyaza/saved_models/r1_qwen7b_32k_dpo
trust_remote_code: true

hub_model_id: riyazahuja/r1_qwen7b_32k_post_dpo

# =====  Quant-efficient loading  =====
load_in_4bit: true
bnb4_quant_type: nf4
bnb4_compute_dtype: bf16

# =====  LoRA headroom  =====
adapter: lora
lora_r: 64
lora_alpha: 128
lora_dropout: 0.1
lora_target_modules: [q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj]



# =====  Long-context & memory tricks  =====
sequence_len: 32768          # max prompt length
sample_packing: false        # keep each long sample intact
flash_attn_2: true           # needs FlashAttention-2 compiled
gradient_checkpointing: true

# =====  Training hyper-params  =====
micro_batch_size: 2
gradient_accumulation_steps: 4   # → effective BS = 8
num_epochs: 1
learning_rate: 5e-6
optimizer: adamw_torch
lr_scheduler: cosine
weight_decay: 0.0
# warmup_steps: 100

# =====  Multi-GPU scaling  =====
deepspeed: /home/riyaza/deepspeed_configs/zero3_bf16_cpuoffload_params_16b_fls.json
bf16: true                    # activations in bfloat16
tf32: false                   # turn on if you prefer
zero3_save_16bit_model: false

# =====  Dataset =====
datasets:
  - path: /home/riyaza/eval_improver/improver/experiments/results/length/EI_tests/sft_dataset_rest.jsonl
    type: alpaca
val_set_size: 0.05

output_dir: /data/user_data/riyaza/saved_models/r1_qwen7b_32k_post_dpo
wandb_project: "r1_qwen7b_32k_post_dpo"

# =====  Evaluation / saves  =====
evals_per_epoch: 2
eval_max_new_tokens: 1024
saves_per_epoch: 1
logging_steps: 2