# ---------- dpo_32k_deepseek-r1-qwen7b-lora.yaml ----------
# Start from the SFT LoRA checkpoint you trained earlier
# base_model: /data/user_data/riyaza/saved_models/r1_qwen7b_32k_lora
# ref_model:  deepseek-ai/DeepSeek-R1-Distill-Qwen-7B    # frozen

base_model: /data/user_data/riyaza/saved_models/r1_qwen7b_32k_full #deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
# ref_model:  deepseek-ai/DeepSeek-R1-Distill-Qwen-7B   # keep
ref_model: /data/user_data/riyaza/saved_models/r1_qwen7b_32k_full

# 2️⃣ tell Axolotl where the SFT adapter lives
# lora_apply_path: /data/user_data/riyaza/saved_models/r1_qwen7b_32k_lora



trust_remote_code: true

# # --- ensure quantized loading matches LoRA SFT checkpoint ---
# load_in_4bit: true          # <-- NEW
# bnb4_quant_type: nf4        # <-- NEW  (or fp4 if that’s what you used)
# bnb4_compute_dtype: bf16    # <-- NEW


hub_model_id: riyazahuja/r1_qwen7b_32k_dpo

# =====  Training method  =====
rl: dpo
rl_beta: 0.1                 # KL-temperature; 0.05–0.2 typical

# # =====  Keep using PEFT so we only touch adapter weights  =====
# adapter: lora
# lora_r: 64
# lora_alpha: 128
# lora_dropout: 0.1
# lora_target_modules: [q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj]

# =====  Long-context & memory settings  =====
sequence_len: 32768
flash_attn_2: true
gradient_checkpointing: true

# =====  Batch & optimisation  =====
micro_batch_size: 2
gradient_accumulation_steps: 4     # ↔ effective BS = 8
num_epochs: 1                      # DPO converges fast; bump only if under-fitting
learning_rate: 1e-5               # 2–5 × 10⁻⁵ works well for LoRA-DPO
optimizer: adamw_torch
lr_scheduler: cosine
warmup_steps: 0
weight_decay: 0.0


# =====  Distributed / memory offload  =====
deepspeed: /home/riyaza/deepspeed_configs/zero3_bf16_cpuoffload_params.json
bf16: true
# zero3_save_16bit_model: false


# =====  Preference-pair data  =====
datasets:
  - path: /home/riyaza/eval_improver/improver/experiments/results/length/EI_tests/dpo_dataset_with_sft_overlap.jsonl
    split: train
    type: chatml.prompt_pairs

val_set_size: 0.05          # evaluate on held-out pairs
output_dir: /data/user_data/riyaza/saved_models/r1_qwen7b_32k_dpo

# Optional trackers
wandb_project: "r1_qwen7b_32k_dpo"
logging_steps: 2
evals_per_epoch: 2
saves_per_epoch: 1

