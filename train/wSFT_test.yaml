# ---- Model ----
base_model: Qwen/Qwen2.5-0.5B
load_in_8bit: false
load_in_4bit: false
# bnb_4bit_quant_type: nf4
# bnb_4bit_use_double_quant: true
# bnb_4bit_compute_dtype: bfloat16

# ---- Finetune adapter ----
# adapter: qlora
# lora_r: 16
# lora_alpha: 32
# lora_dropout: 0.05
# target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# ---- Data ----
datasets:
  - path: train/prepped/wST_test_data
    type: arrow     # ("instruction","input","output" format; extra "weight" stays as-is)

val_set_size: 0.0
train_on_inputs: false  # mask instructions/inputs; predict only outputs

# ---- Plugin to enable weighted loss ----
plugins:
  - axolotl.integrations.weightedSFT.WeightedSFTPlugin
normalize_batch_weights: true    # renormalize weights per batch so scale is stable

# ---- Training ----
output_dir: train/
gradient_accumulation_steps: 1
micro_batch_size: 1
max_steps: 60           # tiny run
learning_rate: 2e-4
lr_scheduler: cosine
warmup_steps: 4
optim: adamw_torch
weight_decay: 0.0
bf16: true
logging_steps: 1
# save_steps: 40
seed: 42

remove_unused_columns: false

